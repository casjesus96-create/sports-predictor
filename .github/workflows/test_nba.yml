name: Validate NBA 1.0.0

on:
  push:
    branches:
      - feature/nba-1.0.0
    paths:
      - "nba_*.py"
      - "NBAApp.tsx"
      - "App.tsx"
      - "main.py"
      - "test_nba_prediction.py"
      - ".github/workflows/test_nba.yml"
  pull_request:
    paths:
      - "nba_*.py"
      - "NBAApp.tsx"
      - "App.tsx"
      - "main.py"
      - "test_nba_prediction.py"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run NBA model tests
        run: pytest -q test_nba_prediction.py
      - name: Compile NBA Python modules
        run: python -m py_compile nba_client.py nba_prediction.py nba_analyzer.py nba_repository.py nba_api.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
