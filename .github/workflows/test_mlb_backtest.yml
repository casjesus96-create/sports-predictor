name: MLB saved-snapshot backtesting

on:
  pull_request:
    paths:
      - "mlb_backtest.py"
      - "mlb_backtest_api.py"
      - "test_mlb_backtest.py"
      - "main.py"
      - ".github/workflows/test_mlb_backtest.yml"
  push:
    branches: [main]
    paths:
      - "mlb_backtest.py"
      - "mlb_backtest_api.py"
      - "test_mlb_backtest.py"
      - "main.py"
      - ".github/workflows/test_mlb_backtest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test MLB backtesting
        run: pytest -q test_mlb_backtest.py
