name: NHL Historical Archive Sync

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "Primera temporada a importar (YYYYYYYY)"
        required: true
        default: "20242025"
      end_season:
        description: "Última temporada a importar (YYYYYYYY)"
        required: true
        default: "20252026"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require source-terms review before any database write
        env:
          NHL_ARCHIVE_SOURCE_TERMS_REVIEWED: ${{ secrets.NHL_ARCHIVE_SOURCE_TERMS_REVIEWED }}
        run: |
          if [ "$NHL_ARCHIVE_SOURCE_TERMS_REVIEWED" != "true" ]; then
            echo "NHL source terms have not been reviewed. No database writes were attempted."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import validated NHL schedules into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          python sync_nhl_archive.py --start-season "${{ inputs.start_season }}" --end-season "${{ inputs.end_season }}" | tee nhl-archive-sync-report.json
      - name: Publish import summary
        if: always()
        run: |
          if [ -f nhl-archive-sync-report.json ]; then
            python -c 'import json; r=json.load(open("nhl-archive-sync-report.json", encoding="utf-8")); print("## NHL historical archive import"); print(""); print("| Season | Unique games | Upserted | Training eligible | Review required |"); print("|---|---:|---:|---:|---|"); [print("| {} | {} | {} | {} | {} |".format(s["season"], s["unique_games"], s["upserted_rows"], s["training_eligible_games"], s["review_required"])) for s in r.get("by_season", [])]; print(""); print("Source terms status:", r.get("source_terms_status"))' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## NHL archive import" >> "$GITHUB_STEP_SUMMARY"
            echo "No import report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload import report
        if: always() && hashFiles('nhl-archive-sync-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nhl-archive-sync-report
          path: nhl-archive-sync-report.json
          if-no-files-found: error
