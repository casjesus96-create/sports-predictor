name: MLB data coverage

on:
  pull_request:
    paths:
      - "analyzer.py"
      - "data_coverage.py"
      - "test_data_coverage.py"
      - ".github/workflows/test_data_coverage.yml"
  push:
    branches: [main]
    paths:
      - "analyzer.py"
      - "data_coverage.py"
      - "test_data_coverage.py"
      - ".github/workflows/test_data_coverage.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Test MLB data coverage
        run: pytest -q test_data_coverage.py
