name: NHL Historical Coverage Audit

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Temporada NHL (YYYYYYYY), por ejemplo 20252026"
        required: true
        default: "20252026"
      teams:
        description: "Abreviaturas separadas por coma; por defecto, franquicias actuales"
        required: false
        default: "ANA,BOS,BUF,CGY,CAR,CHI,COL,CBJ,DAL,DET,EDM,FLA,LAK,MIN,MTL,NSH,NJD,NYI,NYR,OTT,PHI,PIT,SJS,SEA,STL,TBL,TOR,UTA,VAN,VGK,WSH,WPG"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit NHL schedule coverage (read-only)
        id: audit
        continue-on-error: true
        run: |
          python nhl_history_audit.py --season "${{ inputs.season }}" --teams "${{ inputs.teams }}" --output nhl-season-coverage-report.json
      - name: Add readable report to workflow summary
        if: always()
        run: |
          if [ -f nhl-season-coverage-report.json ]; then
            python -c "import json; from nhl_history_audit import render_markdown_summary; report=json.load(open('nhl-season-coverage-report.json', encoding='utf-8')); print(render_markdown_summary(report))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## NHL historical coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No report was generated. Review the audit step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload machine-readable audit report
        if: always() && hashFiles('nhl-season-coverage-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nhl-season-coverage-${{ inputs.season }}
          path: nhl-season-coverage-report.json
          if-no-files-found: error
      - name: Fail workflow when audit finds incomplete coverage
        if: steps.audit.outcome == 'failure'
        run: exit 1
