name: Test Football Chronological Backtest

on:
  pull_request:
    paths:
      - "football_model.py"
      - "football_h2h_experiment.py"
      - "football_backtest.py"
      - "tests/test_football_backtest.py"
      - "tests/test_football_h2h_experiment.py"
      - ".github/workflows/test_football_backtest.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "football_model.py"
      - "football_h2h_experiment.py"
      - "football_backtest.py"
      - "tests/test_football_backtest.py"
      - "tests/test_football_h2h_experiment.py"
      - ".github/workflows/test_football_backtest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run football backtest and H2H tests
        run: |
          pytest -q tests/test_football_backtest.py tests/test_football_h2h_experiment.py
